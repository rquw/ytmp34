<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ytmp34</title>
<meta name="description" content="YouTube to MP3 / MP4. No ads, no redirects.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬇</text></svg>">
<style>
  :root { --bg:#0e0e10; --fg:#ececf1; --mut:#8b8b96; --line:#26262c; --acc:#ff3b3b; --ok:#3ecf8e; }
  @media (prefers-color-scheme: light) { :root { --bg:#fafafa; --fg:#111; --mut:#666; --line:#ddd; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:16px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; padding:16px; }
  main { width:100%; max-width:560px; }
  h1 { font-size:28px; margin:0 0 20px; letter-spacing:-.02em; }
  h1 span { color:var(--acc); }
  input { width:100%; padding:14px 16px; font:inherit; color:inherit; background:transparent;
          border:1px solid var(--line); border-radius:10px; outline:none; }
  input:focus { border-color:var(--mut); }
  .row { display:flex; gap:10px; margin-top:10px; }
  button { flex:1; padding:14px; font:600 16px system-ui, sans-serif; border:0; border-radius:10px; cursor:pointer;
           background:var(--acc); color:#fff; }
  button.alt { background:var(--fg); color:var(--bg); }
  button:disabled { opacity:.5; cursor:default; }
  #status { min-height:24px; margin-top:14px; color:var(--mut); font-size:14px; word-break:break-word; }
  #status.err { color:var(--acc); } #status.ok { color:var(--ok); }
  .bar { height:3px; background:var(--line); border-radius:2px; overflow:hidden; margin-top:10px; visibility:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--acc); transition:width .2s; }
  .bar.busy i { width:30%; animation:slide 1.1s infinite ease-in-out; }
  @keyframes slide { from { transform:translateX(-100%); } to { transform:translateX(340%); } }
  details { margin-top:28px; color:var(--mut); font-size:14px; }
  details input { padding:10px 12px; margin-top:8px; font-size:14px; }
  summary { cursor:pointer; }
  code { background:var(--line); padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<main>
  <h1>yt<span>mp34</span></h1>
  <input id="url" type="url" placeholder="Paste a YouTube link" autocomplete="off" autofocus>
  <div class="row">
    <button id="mp3">MP3</button>
    <button id="mp4" class="alt">MP4</button>
  </div>
  <div class="bar" id="bar"><i></i></div>
  <div id="status"></div>

  <details id="settings">
    <summary>Server <span id="dot">·</span></summary>
    <input id="server" placeholder="https://your-pi.tailXXXX.ts.net">
    <input id="key" placeholder="Key">
    <p>Downloads run on your own Raspberry Pi (yt-dlp). Easiest: open the setup link the Pi installer prints.
       <a href="https://github.com/rquw/ytmp34#readme" style="color:inherit">Setup guide</a>.</p>
  </details>
</main>
<script>
const $ = id => document.getElementById(id);
const store = {
  get: k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
// Setup link from install-pi.sh: #s=<server>&k=<key>, saved once, then removed from the address bar.
const setup = new URLSearchParams(location.hash.slice(1));
if (setup.get("s")) {
  store.set("server", setup.get("s")); store.set("key", setup.get("k") || "");
  history.replaceState(null, "", location.pathname + location.search);
}
$("server").value = store.get("server");
$("key").value = store.get("key");
const server = () => $("server").value.trim().replace(/\/+$/, "");
if (!server()) $("settings").open = true;
const withKey = q => { const k = $("key").value.trim(); return k ? q + "&key=" + encodeURIComponent(k) : q; };

function status(msg, cls = "") { $("status").textContent = msg; $("status").className = cls; }
function bar(mode, pct) {
  const b = $("bar"); b.style.visibility = mode ? "visible" : "hidden";
  b.classList.toggle("busy", mode === "busy");
  b.firstElementChild.style.width = mode === "pct" ? pct + "%" : "";
}

async function ping() {
  if (!server()) { $("dot").textContent = "● not set up"; $("dot").style.color = "var(--acc)"; return false; }
  try {
    const r = await fetch(server() + withKey("/ping?"), { signal: AbortSignal.timeout(3000) });
    const ok = r.ok; $("dot").textContent = ok ? "● online" : "● " + (await r.json()).error;
    $("dot").style.color = ok ? "var(--ok)" : "var(--acc)"; return ok;
  } catch { $("dot").textContent = "● offline"; $("dot").style.color = "var(--acc)"; return false; }
}
["server", "key"].forEach(id => $(id).addEventListener("change", () => { store.set(id, $(id).value.trim()); ping(); }));

const ytId = s => (s.match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([\w-]{11})/) || [])[1];

async function go(fmt) {
  const raw = $("url").value.trim();
  if (!ytId(raw) && !/^https?:\/\//.test(raw)) return status("Paste a YouTube link first.", "err");
  if (!server()) { $("settings").open = true; return status("Open your setup link from the Pi first.", "err"); }
  const btns = [$("mp3"), $("mp4")]; btns.forEach(b => b.disabled = true);
  status(fmt === "mp3" ? "Grabbing audio…" : "Grabbing video…"); bar("busy");
  try {
    const r = await fetch(server() + withKey("/dl?fmt=" + fmt + "&url=" + encodeURIComponent(raw)));
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "HTTP " + r.status);
    const total = +r.headers.get("Content-Length") || 0, reader = r.body.getReader(), parts = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read(); if (done) break;
      parts.push(value); got += value.length;
      if (total) { bar("pct", got / total * 100); status("Saving… " + Math.round(got / total * 100) + "%"); }
    }
    const cd = r.headers.get("Content-Disposition") || "";
    const name = decodeURIComponent((cd.match(/filename\*=UTF-8''([^;]+)/) || [])[1] || "") || "download." + fmt;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(parts, { type: r.headers.get("Content-Type") }));
    a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 30000);
    status("Done: " + name, "ok");
  } catch (e) {
    const offline = e instanceof TypeError;
    status(offline ? "Can't reach your Pi at " + server() + ". Is it on?" : "Failed: " + e.message, "err");
    if (offline) $("settings").open = true;
  } finally { bar(); btns.forEach(b => b.disabled = false); }
}
$("mp3").onclick = () => go("mp3");
$("mp4").onclick = () => go("mp4");
$("url").addEventListener("keydown", e => { if (e.key === "Enter") go(e.shiftKey ? "mp4" : "mp3"); });
const shared = new URLSearchParams(location.search).get("url"); if (shared) $("url").value = shared;
ping();
</script>
</body>
</html>
