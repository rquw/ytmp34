name: PRISMO
options:
  bundleIdPrefix: at.fabiosch
  deploymentTarget:
    iOS: "26.0"
settings:
  SWIFT_VERSION: "5.0"
  MARKETING_VERSION: "1.5"
  CURRENT_PROJECT_VERSION: "6"
  CODE_SIGNING_ALLOWED: "NO"
  CODE_SIGNING_REQUIRED: "NO"
  CODE_SIGN_IDENTITY: ""
targets:
  PRISMO:
    type: application
    platform: iOS
    sources: [PRISMO]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: at.fabiosch.prismo
      TARGETED_DEVICE_FAMILY: "1"
      INFOPLIST_FILE: PRISMO/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
